save_schedule:
  name: Save schedule
  description: Save the full weekly schedule for a zone.
  fields:
    zone_id:
      name: Zone ID
      description: The zone identifier (e.g. "1").
      required: true
      selector:
        text:
    schedule:
      name: Schedule data
      description: "JSON array of day objects [{id, period: [{id, activity, time, enabled}]}]."
      required: true
      selector:
        text:

set_profile:
  name: Set activity profile
  description: Set heat/cool setpoints and fan for a zone activity.
  fields:
    zone_id:
      name: Zone ID
      description: The zone identifier (e.g. "1").
      required: true
      selector:
        text:
    activity:
      name: Activity
      description: Activity name (home, away, sleep, wake, manual).
      required: true
      selector:
        select:
          options:
            - home
            - away
            - sleep
            - wake
            - manual
    htsp:
      name: Heat setpoint
      description: Heat setpoint temperature.
      required: true
      selector:
        number:
          min: 50
          max: 90
          unit_of_measurement: "°F"
    clsp:
      name: Cool setpoint
      description: Cool setpoint temperature.
      required: true
      selector:
        number:
          min: 60
          max: 99
          unit_of_measurement: "°F"
    fan:
      name: Fan mode
      description: Fan speed setting.
      required: false
      selector:
        select:
          options:
            - "off"
            - low
            - med
            - high

cancel_hold:
  name: Cancel hold
  description: Cancel an active hold for a zone, returning it to the scheduled program.
  fields:
    zone_id:
      name: Zone ID
      description: The zone identifier (e.g. "1").
      required: true
      selector:
        text:

set_hold:
  name: Set hold
  description: Set a hold for a zone with a specific activity and optional duration.
  fields:
    zone_id:
      name: Zone ID
      description: The zone identifier (e.g. "1").
      required: true
      selector:
        text:
    activity:
      name: Activity
      description: Activity to hold (home, away, sleep, wake, manual).
      required: true
      selector:
        select:
          options:
            - home
            - away
            - sleep
            - wake
            - manual
    until:
      name: Hold until
      description: "Hold expiration: HH:MM time or 'forever'. Defaults to 2 hours from now."
      required: false
      selector:
        text:

set_whole_house_hold:
  name: Set whole house hold
  description: Set a whole-house hold with a specific activity and optional duration.
  fields:
    activity:
      name: Activity
      description: Activity to hold (home, away, sleep, wake).
      required: true
      selector:
        select:
          options:
            - home
            - away
            - sleep
            - wake
    until:
      name: Hold until
      description: "Hold expiration: HH:MM time or 'forever'. Omit for indefinite hold."
      required: false
      selector:
        text:

cancel_whole_house_hold:
  name: Cancel whole house hold
  description: Cancel the active whole-house hold.
