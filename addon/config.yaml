name: "Infinitude Modern Proxy"
description: "Python/FastAPI rewrite of the Infinitude proxy with a typed OpenAPI northbound API"
version: "2.0.0-alpha.64"
slug: "infinitude_modern"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7

ingress: true
ingress_port: 3001
panel_icon: mdi:thermostat
panel_title: Infinitude Modern

ports:
  3001/tcp: 3001
ports_description:
  3001/tcp: "Thermostat proxy + northbound API"

host_network: false

options:
  carrier_bridge: true
  log_level: info

schema:
  carrier_bridge: bool
  log_level: list(debug|info|warning|error)
